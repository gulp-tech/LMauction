name: Build LMauction plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'LMauction/pom.xml'
      - 'LMauction/src/**'
      - '.github/workflows/build-plugin.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install the exact Purpurbedrock 26.2 API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtime_dir=/tmp/purpurbedrock-runtime
          mkdir -p "$runtime_dir"
          gh release download v26.2.0-bedrock \
            --repo gulp-tech/Purpurbedrock \
            --pattern purpurbedrock-26.2.jar \
            --dir "$runtime_dir"
          cd "$runtime_dir"
          echo "af28303f60bced739700aec31d960e733e328a05c94b53319d2173a62a5f238d  purpurbedrock-26.2.jar" | sha256sum --check --strict

          # The release is a Paperclip launcher. Start it briefly in an
          # isolated directory to materialize the exact server/API libraries.
          echo 'eula=true' > eula.txt
          timeout 90s java -jar purpurbedrock-26.2.jar nogui || true

          # Make a compile-only classpath from the exact extracted runtime
          # libraries. It is never packaged into the plugin JAR.
          mkdir -p compile-api
          while IFS= read -r -d '' jar_file; do
            unzip -qq -o "$jar_file" -d compile-api || true
          done < <(find "$runtime_dir" -type f -name '*.jar' -print0)
          find compile-api/META-INF -type f \( -name '*.SF' -o -name '*.RSA' -o -name '*.DSA' \) -delete || true
          jar --create --file purpurbedrock-api-26.2.jar -C compile-api .
          jar tf purpurbedrock-api-26.2.jar | grep -qx 'org/bukkit/persistence/PersistentDataContainer.class'

          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file \
            -Dfile=purpurbedrock-api-26.2.jar \
            -DgroupId=tech.gulp.purpurbedrock \
            -DartifactId=purpurbedrock-api \
            -Dversion=26.2 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build plugin
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          if ! mvn --batch-mode --no-transfer-progress --file LMauction/pom.xml clean package 2>&1 | tee "$log_file"; then
            details="$(tail -n 50 "$log_file" | tr '\n' ' ' | sed 's/::/: :/g')"
            echo "::error title=Maven build failed::$details"
            exit 1
          fi

      - name: Commit compiled JAR
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- LMauction/target/lmauction-1.0.jar; then
            echo "The tracked JAR is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LMauction/target/lmauction-1.0.jar
          git commit -m "Build lmauction JAR [skip ci]"
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: lmauction-jar
          path: LMauction/target/lmauction-1.0.jar
          if-no-files-found: error
          retention-days: 14

name: Build LMauction plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'LMauction/pom.xml'
      - 'LMauction/src/**'
      - '.github/workflows/build-plugin.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress --file LMauction/pom.xml clean package

      - name: Commit compiled JAR
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- LMauction/target/lmauction-1.0.jar; then
            echo "The tracked JAR is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LMauction/target/lmauction-1.0.jar
          git commit -m "Build lmauction JAR [skip ci]"
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: lmauction-jar
          path: LMauction/target/lmauction-1.0.jar
          if-no-files-found: error
          retention-days: 14
